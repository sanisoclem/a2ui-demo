services:
  app:
    image: a2ui-demo:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data

volumes:
  caddy-data:
